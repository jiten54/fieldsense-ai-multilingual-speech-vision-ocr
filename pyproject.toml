[project]
name = "fieldsense-ai"
version = "1.0.0"
description = "Multilingual Speech, Vision & OCR Intelligence platform for Public Health and Early-Grade Education"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
