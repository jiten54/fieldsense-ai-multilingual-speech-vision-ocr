# FieldSense AI — wav2vec2 CTC Fine-Tuning Configuration

experiment:
  name: fieldsense_wav2vec2_ctc
  seed: 42
  output_dir: experiments/results/wav2vec2
  mlflow_tracking_uri: experiments/mlruns
  tensorboard_dir: experiments/tensorboard/wav2vec2

model:
  pretrained_checkpoint: facebook/wav2vec2-base-960h
  # For multilingual / low-resource Indic adaptation on GPU:
  # facebook/wav2vec2-xls-r-300m
  vocab_path: experiments/configs/wav2vec2_vocab.json
  ctc_loss_reduction: mean
  ctc_zero_infinity: true
  freeze_feature_encoder: true

data:
  manifest_path: data/manifests/speech_manifest.jsonl
  sample_rate: 16000
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  learning_rate: 3.0e-4
  warmup_steps: 50
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  fp16: true
  save_steps: 100
  eval_steps: 100
  logging_steps: 20
  resume_from_checkpoint: null

smoke_test:
  max_train_samples: 8
  max_steps: 2
  per_device_train_batch_size: 2
  fp16: false
